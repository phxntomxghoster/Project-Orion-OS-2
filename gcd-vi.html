<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCD VI - Engine with Cars & Collisions</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', sans-serif; }
        #ui-layer { position: absolute; top: 20px; left: 20px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); z-index: 10; }
        #character-name { font-size: 36px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        #instructions { font-size: 14px; color: #ffcc00; }
        #interaction-prompt { position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: bold; color: #fff; display: none; text-shadow: 2px 2px 4px #000; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: white; border-radius: 50%; transform: translate(-50%, -50%); mix-blend-mode: difference; z-index: 10; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="character-name">Jace</div>
        <div id="instructions">WASD: Move | 1-4: Switch Character | F: Enter/Exit Car</div>
    </div>
    <div id="interaction-prompt">Press 'F' to Drive</div>
    <div id="crosshair"></div>

    <!-- Three.js and GLTFLoader (For when you want real downloaded models) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x404040, 0.7);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(100, 200, 50);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // Ground
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ color: 0x222222 }));
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ==========================================
        // SOLID BUILDINGS & COLLISIONS
        // ==========================================
        const collidableObjects = []; // We will check this array so you don't ghost through walls!
        
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x444455 });
        for (let i = 0; i < 200; i++) {
            const width = Math.random() * 15 + 10;
            const height = Math.random() * 50 + 10;
            const depth = Math.random() * 15 + 10;
            
            const building = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), buildingMat);
            building.position.set((Math.random() - 0.5) * 400, height / 2, (Math.random() - 0.5) * 400);
            
            // Keep the center clear for spawning
            if (Math.abs(building.position.x) < 30 && Math.abs(building.position.z) < 30) continue;

            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);
            
            // Create a Bounding Box for Collision
            const box3 = new THREE.Box3().setFromObject(building);
            collidableObjects.push(box3);
        }

        // ==========================================
        // CAR SYSTEM (Procedural Mesh for now)
        // ==========================================
        const carGroup = new THREE.Group();
        
        // Car Body
        const carBody = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 8), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        carBody.position.y = 1;
        carBody.castShadow = true;
        carGroup.add(carBody);

        // Wheels
        const wheelGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.5, 16);
        wheelGeo.rotateZ(Math.PI / 2);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x050505 });
        
        const positions = [ [-2.2, 0.8, 2.5], [2.2, 0.8, 2.5], [-2.2, 0.8, -2.5], [2.2, 0.8, -2.5] ];
        positions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.position.set(...pos);
            carGroup.add(wheel);
        });

        carGroup.position.set(10, 0, -15);
        scene.add(carGroup);

        // ==========================================
        // PLAYER SYSTEM
        // ==========================================
        const characters = {
            1: { name: "Jace", color: 0xff0000, speed: 0.4 },
            2: { name: "Emily", color: 0x00ff00, speed: 0.4 },
            3: { name: "Amelia", color: 0x0000ff, speed: 0.4 },
            4: { name: "James", color: 0xffcc00, speed: 0.4 }
        };
        let currentPlayer = characters[1];
        let isDriving = false;

        const player = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 2), new THREE.MeshStandardMaterial({ color: currentPlayer.color }));
        player.position.set(0, 2, 0);
        player.castShadow = true;
        scene.add(player);

        const playerBox = new THREE.Box3(); // For player collisions

        // ==========================================
        // CONTROLS & LOGIC
        // ==========================================
        const keys = { w: false, a: false, s: false, d: false, f: false };
        let canToggleCar = true;

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true;
            if (['1', '2', '3', '4'].includes(key) && !isDriving) switchCharacter(parseInt(key));
            
            // Enter/Exit Car Logic
            if (key === 'f' && canToggleCar) {
                const dist = player.position.distanceTo(carGroup.position);
                if (dist < 10 || isDriving) {
                    isDriving = !isDriving;
                    player.visible = !isDriving; // Hide player when driving
                    canToggleCar = false;
                    setTimeout(() => canToggleCar = true, 1000); // Cooldown to prevent spamming
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
        });

        function switchCharacter(id) {
            currentPlayer = characters[id];
            document.getElementById('character-name').innerText = currentPlayer.name;
            document.getElementById('character-name').style.color = '#' + currentPlayer.color.toString(16).padStart(6, '0');
            player.material.color.setHex(currentPlayer.color);
        }

        function checkCollisions(targetBox) {
            for (let i = 0; i < collidableObjects.length; i++) {
                if (targetBox.intersectsBox(collidableObjects[i])) return true;
            }
            return false;
        }

        // ==========================================
        // REAL-TIME ENGINE LOOP
        // ==========================================
        let carSpeed = 0;

        function animate() {
            requestAnimationFrame(animate);
            const prompt = document.getElementById('interaction-prompt');

            if (!isDriving) {
                // PLAYER MOVEMENT (With Collision!)
                const oldPos = player.position.clone();
                if (keys.w) player.translateZ(currentPlayer.speed);
                if (keys.s) player.translateZ(-currentPlayer.speed);
                if (keys.a) player.rotation.y += 0.05;
                if (keys.d) player.rotation.y -= 0.05;

                // Check Wall Bump
                playerBox.setFromObject(player);
                if (checkCollisions(playerBox)) {
                    player.position.copy(oldPos); // Reverse movement if hit wall
                }

                // Show Car prompt
                prompt.style.display = (player.position.distanceTo(carGroup.position) < 10) ? 'block' : 'none';

                // Camera follow player
                const offset = new THREE.Vector3(0, 10, -15).applyMatrix4(player.matrixWorld);
                camera.position.lerp(offset, 0.1);
                camera.lookAt(player.position);
            } else {
                // CAR DRIVING PHYSICS
                prompt.style.display = 'none';
                
                if (keys.w) carSpeed = Math.min(carSpeed + 0.02, 1.2); // Accelerate
                else if (keys.s) carSpeed = Math.max(carSpeed - 0.02, -0.5); // Reverse
                else carSpeed *= 0.95; // Friction

                if (keys.a && Math.abs(carSpeed) > 0.1) carGroup.rotation.y += 0.04;
                if (keys.d && Math.abs(carSpeed) > 0.1) carGroup.rotation.y -= 0.04;

                const oldCarPos = carGroup.position.clone();
                carGroup.translateZ(carSpeed);

                // Car Collision Check
                const carBox = new THREE.Box3().setFromObject(carGroup);
                if (checkCollisions(carBox)) {
                    carGroup.position.copy(oldCarPos);
                    carSpeed = 0; // Crash! Stop the car
                }

                // Snap player to car so they pop out in the right spot
                player.position.copy(carGroup.position);
                player.position.y += 2;
                player.position.x += 4; // Exit by the door

                // Camera follow car
                const offset = new THREE.Vector3(0, 15, -25).applyMatrix4(carGroup.matrixWorld);
                camera.position.lerp(offset, 0.1);
                camera.lookAt(carGroup.position);
            }

            renderer.render(scene, camera);
        }

        // ==========================================
        // EXTERNAL MODEL LOADER (For Later!)
        // ==========================================
        // When you find a cool .glb file, just uncomment this:
        /*
        const loader = new THREE.GLTFLoader();
        loader.load('YOUR_MODEL_LINK_HERE.glb', function (gltf) {
            scene.add(gltf.scene);
        });
        */

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
