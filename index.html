<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>MythosOS</title>
<style>
@property --h{syntax:'<number>';inherits:true;initial-value:200}
:root{--bg:#0a1316;--s:#12212a;--s2:#1b313c;--t:#e8eef0;--m:#93a8b1;--a:#e8a45a;--ai:#1a1206;--b:#ffffff24;--sh:0 14px 44px #0009;--d:.24s}
:root[data-theme=light]{--bg:#eef1ec;--s:#fbfcfa;--s2:#e1e7df;--t:#14201c;--m:#556760;--a:#a85512;--ai:#fff;--b:#00000026;--sh:0 14px 44px #0003}
:root[data-theme=midnight]{--bg:#0b0e24;--s:#141a3d;--s2:#1f2756;--t:#e9ecff;--m:#97a0d6;--a:#8aa2ff;--ai:#06102e}
:root[data-theme=aurora]{--bg:#06141a;--s:#0d2a2c;--s2:#14403d;--t:#e6fbf3;--m:#86b9aa;--a:#5be3b0;--ai:#03140e}
:root[data-theme=graphite]{--bg:#161616;--s:#222;--s2:#2e2e2e;--t:#eee;--m:#9a9a9a;--a:#cfd4dc;--ai:#111}

:root[data-anim="1"]{--d:.08s}:root[data-anim="0"]{--d:0s}:root[data-perf]{--d:.06s}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:14px/1.45 system-ui,"Segoe UI Variable Text","SF Pro Text",Inter,Roboto,sans-serif;background:var(--bg);color:var(--t);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:8px 11px;min-width:0}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
h1,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600}
h2{font-size:1.05em;margin:26px 0 10px}h3{margin:18px 0 8px;font-size:1.2em}p+p{margin-top:8px}
.i{width:1.3em;height:1.3em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sp{flex:1}.nt2{color:var(--m);font-size:.85em}

#os{position:fixed;inset:0;--top:56px;--bot:76px}
#os[data-mode=desktop]{--top:0px}

.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.22em;font-size:.86em}

.nav{display:flex;gap:4px;margin-left:10px}

.tab:hover{color:var(--t)}.tab[aria-current=page]{color:var(--t);background:var(--s2)}

#tray{display:flex;align-items:center;gap:6px}

.bdg{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--a);color:var(--ai);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#clk{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;padding:0 8px;font-variant-numeric:tabular-nums;font-size:.86em}#clk small{color:var(--m)}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--a),#6b4bd0);color:var(--ai);font-weight:700;display:grid;place-items:center}
.ap{width:44px;height:44px;border-radius:28%;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(135deg,hsl(var(--h) 70% 55%),hsl(calc(var(--h) + 40) 60% 30%))}
#home{position:fixed;inset:var(--top) 0 0;overflow-y:auto;padding:12px clamp(16px,4vw,56px) 110px;z-index:10;transition:opacity var(--d),transform var(--d)}
#os[data-mode=desktop] #home{opacity:0;transform:scale(.985);visibility:hidden;pointer-events:none;transition:opacity var(--d),transform var(--d),visibility 0s var(--d)}
#hero{--h:28;position:relative;color:#fff;min-height:min(46vh,420px);display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between;padding:clamp(20px,4vw,44px);border-radius:28px;overflow:hidden;border:1px solid var(--b);transition:--h .7s;background:radial-gradient(70% 120% at 85% 20%,hsl(var(--h) 70% 45%/.55),transparent 70%),linear-gradient(135deg,hsl(var(--h) 45% 14%),hsl(var(--h) 40% 8%))}
.hc{max-width:560px;animation:fade var(--d) backwards}.tg{opacity:.8}

.hb{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

.pb{background:var(--a);color:var(--ai)}.sb{background:var(--s2);border:1px solid var(--b)}.sb[aria-pressed=true] .i{fill:currentColor}
#hero .sb{background:#ffffff22;color:#fff}
.fs{display:flex;gap:10px;flex-wrap:wrap}
.fc{width:140px;padding:10px;border-radius:16px;background:#0006;border:1px solid #ffffff22;color:#fff;font-size:.86em}

.qa{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.pill{padding:8px 15px;border-radius:99px;background:var(--s);border:1px solid var(--b);display:inline-flex;gap:8px;align-items:center}.pill:hover{border-color:var(--a)}
.row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;padding:8px 4px 16px;margin:0 -4px;scrollbar-width:thin}
.card{position:relative;flex:none;width:200px;scroll-snap-align:start;border-radius:20px;background:var(--s);border:1px solid var(--b);transition:transform var(--d),box-shadow var(--d),border-color var(--d)}

.cb{display:block;width:100%;border-radius:inherit}.cb:focus-visible{outline-offset:-3px}
.art{aspect-ratio:16/10;border-radius:19px 19px 0 0;display:grid;place-items:center;background:radial-gradient(80% 90% at 70% 10%,hsl(var(--h) 80% 60%/.8),transparent),linear-gradient(135deg,hsl(var(--h) 55% 32%),hsl(calc(var(--h) + 50) 50% 14%))}
.art span{font:700 clamp(34px,5vw,54px) Georgia,serif;color:#fff;opacity:.9}
.ci{padding:10px 14px 14px}.ci small{display:flex;justify-content:space-between;color:var(--m)}
.fv{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:#000a;color:#fff;display:grid;place-items:center}
.fv[aria-pressed=true]{background:var(--a);color:var(--ai)}.fv[aria-pressed=true] .i{fill:currentColor}
.card.app{width:150px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}.card.app small{color:var(--m)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stt{padding:14px 16px;border-radius:16px;background:var(--s);border:1px solid var(--b);display:flex;flex-direction:column}.stt small{color:var(--m)}.stt b{font-size:1.2em}
#desk{position:fixed;inset:0 0 80px;padding:18px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,98px);grid-auto-columns:96px;gap:6px;align-content:start;justify-content:start;z-index:5;transition:opacity var(--d)}
#os[data-mode=home] #desk{opacity:0;visibility:hidden;pointer-events:none}
.di{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:12px;color:#fff;text-shadow:0 1px 4px #000c;font-size:.8em;text-align:center;overflow:hidden;word-break:break-word; cursor: pointer;}
.di:hover{background:#ffffff1a}.di.pick{background:#ffffff33;outline:1px solid #fff9}
.di .ap{width:46px;height:46px}
#wins{position:fixed;inset:0;z-index:20;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--s);border:1px solid var(--b);border-radius:16px;box-shadow:0 8px 30px #0006;overflow:hidden;container-type:inline-size;animation:pop var(--d) backwards;min-width:300px;min-height:200px}
.win.on{box-shadow:var(--sh);border-color:color-mix(in srgb,var(--a) 55%,var(--b))}.win.min{display:none}
.win.out{opacity:0;transform:scale(.96);transition:var(--d)}
.win.max{left:0!important;top:var(--top)!important;width:100%!important;height:calc(100% - var(--top) - var(--bot))!important;border-radius:0}
.wt{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;background:var(--s2);touch-action:none;user-select:none;cursor:grab}
.win:not(.on) .wt{opacity:.7}
.wt .ap{width:24px;height:24px;border-radius:7px}.wt .ap .i{width:15px;height:15px}
.wt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt button{width:30px;height:28px;border-radius:8px;display:grid;place-items:center}.wt button:hover{background:var(--b)}.wt [data-w=x]:hover{background:#d24;color:#fff}
.wb{flex:1;min-height:0;overflow:auto; display:flex; flex-direction:column;}
.rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 55%,var(--m) 55% 62%,transparent 62% 76%,var(--m) 76% 83%,transparent 83%)}.win.max .rs{display:none}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
#dock{position:fixed;bottom:10px;left:10px;right:10px;height:62px;display:flex;align-items:center;gap:6px;padding:0 10px;z-index:60;background:color-mix(in srgb,var(--s) 88%,transparent);border:1px solid var(--b);border-radius:20px;box-shadow:var(--sh);backdrop-filter:blur(16px);transition:transform var(--d)}
#os[data-mode=home] #dock{left:50%;right:auto;translate:-50% 0;max-width:calc(100vw - 20px)}
#os[data-mode=home][data-run="0"] #dock{transform:translateY(140%)}
#dapps{flex:1;display:flex;gap:6px;align-items:center;overflow-x:auto;min-width:0;padding:4px}
.dk{position:relative;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}.dk:hover,.dk.on{background:var(--s2)}.dk .ap{width:36px;height:36px}
.dk.run::after{content:"";position:absolute;bottom:1px;left:50%;width:6px;height:4px;margin-left:-3px;border-radius:2px;background:var(--m)}
.dk.on::after{width:18px;margin-left:-9px;background:var(--a)}.dk.mn .ap{opacity:.55}
.ov{position:fixed;inset:0;z-index:100;opacity:0;visibility:hidden;display:flex;transition:opacity var(--d),visibility 0s var(--d)}
.ov.show{opacity:1;visibility:visible;transition:opacity var(--d)}
#lau{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(22px);justify-content:center;align-items:flex-start;padding:8vh 16px 16px}

.pn{background:var(--s);border:1px solid var(--b);border-radius:22px;box-shadow:var(--sh);padding:16px;max-height:calc(100vh - 24px);overflow:auto;width:min(760px,100%);transform:translateY(10px) scale(.98);transition:transform var(--d)}
.ov.show .pn{transform:none}#pal .pn{width:min(560px,100%)}
.pp{justify-content:flex-end;align-items:flex-start;padding:62px 14px}.pp .pn{width:min(380px,100%)}

.qb{display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:16px;padding:4px 14px}.qb:focus-within{outline:2px solid var(--a)}

.gt{font-size:.8em;color:var(--m);margin:16px 8px 6px;font-weight:600}
.res{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:14px;cursor:pointer}.res small{display:block;color:var(--m)}
.res:hover,.res.sel{background:var(--s2)}.res.sel{box-shadow:inset 3px 0 var(--a)}.res .ap{width:36px;height:36px}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px}
.emp{color:var(--m);padding:30px 16px;text-align:center;grid-column:1/-1; display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1;}
.tg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:16px;background:var(--s2);min-height:84px}.tile .i{margin-bottom:6px}.tile small{opacity:.8}
.tile[aria-pressed=true]{background:var(--a);color:var(--ai)}
.nt{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--s2);margin-top:8px;position:relative;animation:pop var(--d) backwards}

.sws{display:flex;gap:12px;padding:16px;background:var(--s);border:1px solid var(--b);border-radius:24px;box-shadow:var(--sh);max-width:calc(100vw - 24px);overflow-x:auto}

.swi[aria-current=true]{background:var(--s2);outline:2px solid var(--a)}.swi small{color:var(--m);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toasts{position:fixed;top:64px;right:16px;z-index:130;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(340px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;padding:12px 14px;border-radius:16px;background:var(--s);border:1px solid var(--b);box-shadow:var(--sh);animation:pop var(--d) backwards,tout var(--d) 4s forwards}.toast .ap{width:34px;height:34px}.toast small{color:var(--m)}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#cm{position:fixed;z-index:140;min-width:210px;padding:6px;border-radius:14px;background:var(--s);border:1px solid var(--b);box-shadow:var(--sh);display:none}

dialog{margin:auto;background:var(--s);color:var(--t);border:1px solid var(--b);border-radius:20px;padding:22px;box-shadow:var(--sh);width:min(420px,calc(100vw - 32px))}

.ar,.se{display:flex;height:100%}
.side{width:178px;flex:none;border-right:1px solid var(--b);padding:10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}

<script>
'use strict';
/* ===== Core helpers ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const ic=n=>`<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);
const ago=t=>{const s=(Date.now()-t)/1e3;return s<60?'just now':s<3600?Math.floor(s/60)+' min ago':s<86400?Math.floor(s/3600)+' h ago':new Date(t).toLocaleDateString()};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ===== Data ===== */
const THEMES={dark:'Mythos Dark',light:'Mythos Light',midnight:'Midnight',aurora:'Aurora',graphite:'Graphite',nebula:'Nebula'};
const THC={dark:['#0a1316','#e8a45a'],light:['#eef1ec','#a85512'],midnight:['#0b0e24','#8aa2ff'],aurora:['#06141a','#5be3b0'],graphite:['#161616','#cfd4dc'],nebula:['#150b26','#d58bff']};
const WALLS={
  obsidian:['Obsidian','radial-gradient(90% 80% at 85% 0%,#1f5560aa,transparent 60%),radial-gradient(70% 60% at 0% 100%,#4a3216aa,transparent 60%),#0a1316'],
  midnight:['Midnight','linear-gradient(160deg,#0b1030,#1c2760 55%,#0b1030)'],
  nebula:['Nebula','radial-gradient(60% 50% at 72% 28%,#8a35c8bb,transparent),radial-gradient(55% 55% at 18% 82%,#1f6fb8aa,transparent),#0e0820'],
  aurora:['Aurora','radial-gradient(80% 50% at 30% 90%,#1f9a7baa,transparent),linear-gradient(120deg,#031a1f,#0b4a45 45%,#0a2f3b)'],
  abstract:['Abstract','conic-gradient(from 210deg at 70% 40%,#e8a45a66,#1d4a52,#2a1a3a,#e8a45a66),#0a1316'],
  minimal:['Minimal','linear-gradient(#2a3036,#14181b)'],
  grid:['Mythos Grid','linear-gradient(#ffffff10 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,#ffffff10 1px,transparent 1px) 0 0/48px 48px,radial-gradient(80% 60% at 50% 0,#1d4a52,#0a1316)']
};
const ACC=['#e8a45a','#8aa2ff','#5be3b0','#ff7a90','#d58bff','#f2d65c'];
const CATS=['Arcade','Racing','Puzzle','Strategy','Sports','Platformer','Retro','Simulation','Sandbox','Casual','Multiplayer','Mythos Originals'];

const G=[
['runner','Mythos Runner',['Platformer','Mythos Originals'],28,4.7,'Sprint through shifting ruins in a one-button endless run.','Space or tap: jump. Down: slide.'],
['kart','Mythos Kart',['Racing','Mythos Originals','Multiplayer'],200,4.5,'Drift, boost and outpace friends on floating tracks.','Arrows: steer. Space: drift.'],
['drive','Mythos Drive',['Racing','Mythos Originals','Simulation'],160,4.3,'A calm night drive across an endless coastline.','W and S: throttle. A and D: steer.'],
['defense','Mythos Defense',['Strategy','Mythos Originals'],350,4.6,'Hold the relay line with towers, traps and timing.','Mouse: place towers. Space: start wave.'],
['golf','Mythos Golf',['Sports','Mythos Originals','Casual'],120,4.4,'Nine strange holes. Aim, pull back, release.','Drag to aim. Release to swing.'],
['labs','Mythos Labs',['Sandbox','Mythos Originals','Puzzle'],290,4.2,'Combine elements and discover what the lab can build.','Drag to combine. Right-click to inspect.'],
['arena','Mythos Arena',['Multiplayer','Mythos Originals','Arcade'],10,4.5,'Fast duels in a shrinking arena. First to five wins.','WASD: move. Mouse: aim.'],
['blocks','Mythos Blocks',['Puzzle','Mythos Originals','Casual'],55,4.8,'Fit shifting shapes into a growing tower.','Arrows: move. Up: rotate.'],
['orbit','Orbit Dash',['Arcade'],240,4.1,'Slingshot between planets and chase the high score.','Click to launch.'],
['tycoon','Tiny Tycoon',['Simulation','Casual'],90,4.0,'Grow a pocket-sized town into a thriving city.','Mouse only.'],
['echo','Cave Echo',['Retro','Platformer'],320,4.2,'A pixel-era descent guided by sound.','Arrows: move. Z: ping.'],
['kick','Pitch Perfect',['Sports','Multiplayer'],140,3.9,'Quick five-a-side matches with friends.','Arrows: move. X: pass.']
].map(([id,t,c,h,r,d,k])=>({id,t,c,h,r,d,k}));

const APPS={
arcade:{n:'Mythos Arcade',i:'arcade',h:28,w:[940,620],d:'Your game library'},
files:{n:'Mythos Files',i:'folder',h:190,w:[780,520],d:'Browse the virtual file system'},
ai:{n:'Mythos AI',i:'ai',h:265,w:[460,640],d:'Local assistant for MythosOS'},
sentinel:{n:'Sentinel',i:'shield',h:150,w:[540,580],d:'System status and privacy'},
settings:{n:'Settings',i:'gear',h:215,w:[860,580],d:'Personalize and configure'}};

const CMDS=[['Open Files','app:files','folder'],['Open Arcade','app:arcade','arcade'],['Open Settings','app:settings','gear'],['Open AI','app:ai','ai'],['Open Sentinel','app:sentinel','shield'],['Toggle Dark Mode','theme','sun'],['Change Wallpaper','wall:next','apps'],['Open Notifications','ov:nc','bell'],['Switch Home Mode','mode:home','apps'],['Switch Desktop Mode','mode:desktop','apps'],['Open Control Center','ov:cc','sliders'],['Toggle Fullscreen','fs','max'],['Switch Windows','swstart','apps']];

/* ===== Persistence with recovery ===== */
const KEY='mythos.v1',T0=Date.now();
const D={theme:'dark',wall:'obsidian',accent:'',anim:2,mode:'desktop',dnd:false,perf:false,name:'Projecttt',pins:['arcade','files','ai','sentinel','settings'],fav:[],rec:[],played:{},geo:{},chat:[]};
const norm=(o,d=0)=>{if(typeof o==='string')return o.slice(0,6000);if(o&&typeof o==='object'&&!Array.isArray(o)&&d<8){const r=Object.create(null);for(const k of Object.keys(o))r[k]=norm(o[k],d+1);return r}throw 0};

let S={...D},FS,bad=false;
try{
    const r=ls.get(KEY);
    if(r){
        const o=JSON.parse(r);
        S={...D,...o.s};
        FS=norm(o.fs);
    }
}catch(e){
    bad=true;
    S={...D};
    FS=null;
}

if(!THEMES[S.theme])S.theme=D.theme;
if(!WALLS[S.wall])S.wall=D.wall;
if(!/^#[0-9a-f]{6}$/i.test(S.accent))S.accent='';
S.mode=S.mode==='home'?'home':'desktop';
if(![0,1,2].includes(S.anim))S.anim=2;
S.name=String(S.name||D.name).slice(0,24)||D.name;
S.dnd=!!S.dnd;
S.perf=!!S.perf;

for(const k of['pins','fav','rec','chat'])if(!Array.isArray(S[k]))S[k]=[];
for(const k of['played','geo'])if(!S[k]||typeof S[k]!=='object'||Array.isArray(S[k]))S[k]={};
S.pins=S.pins.filter(k=>APPS[k]);
S.fav=S.fav.filter(k=>G.some(g=>g.id===k));

// === FIX: Completed the truncated array mapping ===
S.rec = S.rec.filter(r => r && (r.k === 'a' ? APPS[r.id] : G.some(g => g.id === r.id)));

if(!FS){
    FS = {
        'Documents': {},
        'Pictures': {},
        'System': { 'readme.txt': 'Welcome to MythosOS engine v1.0.' }
    };
}

const save = () => ls.set(KEY, JSON.stringify({ s: S, fs: FS }));

// Clock system
const updateClock = () => {
    const d = new Date();
    $('#clk b').textContent = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    $('#clk small').textContent = d.toLocaleDateString();
};
setInterval(updateClock, 1000);
updateClock();

// Boot sequence
setTimeout(() => $('#boot').classList.add('off'), 1200);

// Set theme and wall
document.documentElement.setAttribute('data-theme', S.theme);
if (WALLS[S.wall]) $('#wall').style.background = WALLS[S.wall][1];
$('#os').setAttribute('data-mode', S.mode);

// =======================
// WINDOW MANAGER ENGINE
// =======================
let zIndex = 20;
const wins = {};

const renderDock = () => {
    const dapps = $('#dapps');
    dapps.innerHTML = '';
    S.pins.forEach(id => {
        const app = APPS[id];
        if(!app) return;
        const isRun = !!wins[id];
        const btn = document.createElement('button');
        btn.className = 'dk' + (isRun ? ' run' : '');
        // Highlight active window if it has the highest zIndex
        if (isRun && wins[id].el.style.zIndex == zIndex) btn.classList.add('on');
        
        btn.innerHTML = `<span class="ap" style="--h:${app.h}"><svg class="i"><use href="#i-${app.i}"/></svg></span>`;
        btn.onclick = () => {
            if (isRun) {
                const win = wins[id].el;
                if (win.classList.contains('min')) {
                    win.classList.remove('min');
                }
                win.style.zIndex = ++zIndex;
                renderDock();
            } else {
                openWin(id);
            }
        };
        dapps.appendChild(btn);
    });
    // Let OS know if apps are running (for docking animations on Home mode)
    $('#os').setAttribute('data-run', Object.keys(wins).length > 0 ? "1" : "0");
};

const openWin = (id) => {
    if (wins[id]) {
        wins[id].el.classList.remove('min');
        wins[id].el.style.zIndex = ++zIndex;
        renderDock();
        return;
    }
    const app = APPS[id];
    if (!app) return;
    
    const w = document.createElement('div');
    w.className = 'win on';
    w.style.width = app.w[0] + 'px';
    w.style.height = app.w[1] + 'px';
    
    // Center it
    const cx = Math.max(20, (window.innerWidth - app.w[0]) / 2);
    const cy = Math.max(60, (window.innerHeight - app.w[1]) / 2);
    w.style.left = cx + 'px';
    w.style.top = cy + 'px';
    w.style.zIndex = ++zIndex;

    w.innerHTML = `
        <div class="wt">
            <span class="ap" style="--h:${app.h}"><svg class="i"><use href="#i-${app.i}"/></svg></span>
            <b>${app.n}</b>
            <span class="sp"></span>
            <button data-w="min"><svg class="i"><use href="#i-min"/></svg></button>
            <button data-w="max"><svg class="i"><use href="#i-max"/></svg></button>
            <button data-w="x"><svg class="i"><use href="#i-x"/></svg></button>
        </div>
        <div class="wb">
            <div class="emp">
                <span class="ap" style="--h:${app.h}; width:64px; height:64px; margin-bottom:16px"><svg class="i" style="width:2em;height:2em"><use href="#i-${app.i}"/></svg></span>
                <h2>Welcome to ${app.n}</h2>
                <p>${app.d}</p>
            </div>
        </div>
        <div class="rs"></div>
    `;
    $('#wins').appendChild(w);     wins[id] = { el: w };      // Focus system     w.addEventListener('mousedown', () => {          w.style.zIndex = ++zIndex;          $$('.win.on').forEach(el => el.classList.remove('on'));
        w.classList.add('on');
        renderDock();
    });

    // Top bar controls
    w.querySelector('[data-w="x"]').onclick = () => { w.remove(); delete wins[id]; renderDock(); };
    w.querySelector('[data-w="min"]').onclick = () => { w.classList.add('min'); renderDock(); };
    w.querySelector('[data-w="max"]').onclick = () => { w.classList.toggle('max'); };

    // Drag System
    const wt = w.querySelector('.wt');
    let dragging = false, rx, ry;
    wt.onpointerdown = (e) => {
        if(e.target.closest('button')) return;
        dragging = true;
        const rect = w.getBoundingClientRect();
        rx = e.clientX - rect.left;
        ry = e.clientY - rect.top;
        wt.setPointerCapture(e.pointerId);
    };
    wt.onpointermove = (e) => {
        if(!dragging) return;
        w.style.left = (e.clientX - rx) + 'px';
        w.style.top = (e.clientY - ry) + 'px';
    };
    wt.onpointerup = (e) => { dragging = false; wt.releasePointerCapture(e.pointerId); };

    // Resize System
    const rs = w.querySelector('.rs');
    let resizing = false, rw, rh, startX, startY;
    rs.onpointerdown = (e) => {
        resizing = true;
        const rect = w.getBoundingClientRect();
        rw = rect.width; rh = rect.height;
        startX = e.clientX; startY = e.clientY;
        rs.setPointerCapture(e.pointerId);
        e.
